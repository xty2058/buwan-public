<!doctype html>
<!--
  页面：S1 发现角色与第一次开聊（pages/discover.html）
  服务场景：S1 —— 挑剔、没耐心，要挑一个“合拍”的角色并聊出像样的开场。
  布局（参考猫箱的信息层级，视觉沿用不晚规范）：开场 / 对话 → 名字与性格（固定）→ 输入框。
  用户任务：一屏一个人，上下滑看下一个；看到合拍的，直接把替你写好的第一句发出去。
  成功标准：打开即全屏人物，不经过任何卡片或列表；每个角色都给出一个开场情境和他的第一句原话；
            主操作就是输入框，里面已替用户写好一句，发送 = 开聊，一次点击、免注册；
            想换开场只需点面板右上角，不离开当前角色。
  布局模板：T5 沉浸全屏（.bw-immersive-page / .bw-immersive / .bw-feed）
  组件：Spotlight · Tag(on-image) · OpeningPanel · Starter · IconButton(primary / on-image) · Tabbar(solid)
  四关键词：同一个人 —— 立绘就是这个人，开场原话即人设；
            记得对 —— 首聊没有记忆，不做虚假承诺；
            接得上 —— 发出的第一句就是长期会话的第一句；
            由用户决定 —— 替你写的话可以直接发，也可以改，也可以换开场或滑走，不推任何东西。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="bw-icons" content="../assets/icons.svg">
<title>不晚 · 发现</title>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/layout.css">
<link rel="stylesheet" href="../styles/components.css">
<script>try{if(localStorage.getItem('bw-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<script src="../scripts/main.js" defer></script>
<script src="../scripts/pages/discover.js" defer></script>
</head>
<body class="bw-immersive-page">
<a class="bw-skip" href="#feed">跳到角色</a>
<img class="bw-immersive__backdrop" src="../assets/characters/linyu.jpg" alt="" aria-hidden="true" data-backdrop>

<div class="bw-immersive" data-scene="S1" data-principle="P0 P1 P4">
  <header class="bw-immersive__top">
    <span class="bw-wordmark">不晚</span>
  </header>

  <main id="feed" class="bw-feed" tabindex="0" aria-label="角色，上下滑动切换">
    <h1 class="bw-sr-only">今晚，想和谁说说话</h1>

    <article class="bw-spotlight" aria-labelledby="name-linyu" data-character="linyu">
      <img class="bw-spotlight__image" src="../assets/characters/linyu.jpg" width="1024" height="1536" alt="林屿站在下雨的旧书店里，穿着绿色开衫，抱着一本旧书，窗外是河和石桥" decoding="async">
      <div class="bw-spotlight__content">
        <div class="bw-opening-panel" data-panel>
          <div class="bw-opening-panel__head">
            <span class="bw-opening-panel__scene" data-scene-name>雨天傍晚 · 临河旧书店</span>
            <button class="bw-icon-btn bw-icon-btn--sm bw-icon-btn--on-image" type="button" data-swap aria-label="换个开场"><svg class="bw-icon bw-icon--sm" aria-hidden="true"><use href="../assets/icons.svg#refresh"/></svg></button>
          </div>
          <p class="bw-opening-panel__line" data-line>「可以先坐一会儿。今天想找书，还是想找个安静的地方？」</p>
        </div>
        <div class="bw-spotlight__intro">
          <div class="bw-cluster bw-cluster--3">
            <h2 class="bw-spotlight__name" id="name-linyu">林屿</h2>
            <span class="bw-spotlight__role">25 · 独立书店店主</span>
          </div>
          <div class="bw-spotlight__tags">
            <span class="bw-tag bw-tag--on-image">温柔慢热</span>
            <span class="bw-tag bw-tag--on-image">留有余地</span>
          </div>
        </div>
        <form class="bw-starter" data-starter>
          <label class="bw-sr-only" for="say-linyu">对林屿说</label>
          <input class="bw-starter__input" id="say-linyu" name="say" autocomplete="off" enterkeyhint="send" value="想找个安静的地方，雨停之前。" data-say>
          <button class="bw-icon-btn bw-icon-btn--primary" type="submit" aria-label="发送，开始和林屿聊"><svg class="bw-icon" aria-hidden="true"><use href="../assets/icons.svg#arrow-up"/></svg></button>
        </form>
      </div>
    </article>

    <article class="bw-spotlight" aria-labelledby="name-luye" data-character="luye">
      <img class="bw-spotlight__image" src="../assets/characters/luye.jpg" width="1024" height="1536" alt="陆野在排练室里抱着一把旧电吉他笑，穿着红色衬衫，身后是鼓和音箱" loading="lazy" decoding="async">
      <div class="bw-spotlight__content">
        <div class="bw-opening-panel" data-panel>
          <div class="bw-opening-panel__head">
            <span class="bw-opening-panel__scene" data-scene-name>排练刚结束 · 街角排练室</span>
            <button class="bw-icon-btn bw-icon-btn--sm bw-icon-btn--on-image" type="button" data-swap aria-label="换个开场"><svg class="bw-icon bw-icon--sm" aria-hidden="true"><use href="../assets/icons.svg#refresh"/></svg></button>
          </div>
          <p class="bw-opening-panel__line" data-line>「刚才那一段，你听见了？还差个结尾。想听我再弹一遍吗？」</p>
        </div>
        <div class="bw-spotlight__intro">
          <div class="bw-cluster bw-cluster--3">
            <h2 class="bw-spotlight__name" id="name-luye">陆野</h2>
            <span class="bw-spotlight__role">24 · 独立乐队吉他手</span>
          </div>
          <div class="bw-spotlight__tags">
            <span class="bw-tag bw-tag--on-image">坦率直接</span>
            <span class="bw-tag bw-tag--on-image">偶尔嘴硬</span>
          </div>
        </div>
        <form class="bw-starter" data-starter>
          <label class="bw-sr-only" for="say-luye">对陆野说</label>
          <input class="bw-starter__input" id="say-luye" name="say" autocomplete="off" enterkeyhint="send" value="想。结尾我好像有个想法。" data-say>
          <button class="bw-icon-btn bw-icon-btn--primary" type="submit" aria-label="发送，开始和陆野聊"><svg class="bw-icon" aria-hidden="true"><use href="../assets/icons.svg#arrow-up"/></svg></button>
        </form>
      </div>
    </article>

    <article class="bw-spotlight" aria-labelledby="name-shenyan" data-character="shenyan">
      <img class="bw-spotlight__image" src="../assets/characters/shenyan.jpg" width="1024" height="1536" alt="沈砚站在建筑工作室的窗边，穿深蓝外套，手里拿着速写本和铅笔，桌上有建筑模型" loading="lazy" decoding="async">
      <div class="bw-spotlight__content">
        <div class="bw-opening-panel" data-panel>
          <div class="bw-opening-panel__head">
            <span class="bw-opening-panel__scene" data-scene-name>街区开放日 · 窗边工作室</span>
            <button class="bw-icon-btn bw-icon-btn--sm bw-icon-btn--on-image" type="button" data-swap aria-label="换个开场"><svg class="bw-icon bw-icon--sm" aria-hidden="true"><use href="../assets/icons.svg#refresh"/></svg></button>
          </div>
          <p class="bw-opening-panel__line" data-line>「这张还没画完。你可以随便看看，感兴趣的话，我讲给你听。」</p>
        </div>
        <div class="bw-spotlight__intro">
          <div class="bw-cluster bw-cluster--3">
            <h2 class="bw-spotlight__name" id="name-shenyan">沈砚</h2>
            <span class="bw-spotlight__role">28 · 建筑设计师</span>
          </div>
          <div class="bw-spotlight__tags">
            <span class="bw-tag bw-tag--on-image">理性克制</span>
            <span class="bw-tag bw-tag--on-image">认真可靠</span>
          </div>
        </div>
        <form class="bw-starter" data-starter>
          <label class="bw-sr-only" for="say-shenyan">对沈砚说</label>
          <input class="bw-starter__input" id="say-shenyan" name="say" autocomplete="off" enterkeyhint="send" value="我想听。这扇窗为什么开在这里？" data-say>
          <button class="bw-icon-btn bw-icon-btn--primary" type="submit" aria-label="发送，开始和沈砚聊"><svg class="bw-icon" aria-hidden="true"><use href="../assets/icons.svg#arrow-up"/></svg></button>
        </form>
      </div>
    </article>
  </main>

  <nav class="bw-tabbar bw-tabbar--solid" aria-label="主导航">
    <a class="bw-tabbar__item" href="discover.html" aria-current="page"><svg class="bw-icon" aria-hidden="true"><use href="../assets/icons.svg#compass"/></svg>发现</a>
    <a class="bw-tabbar__item" href="chat.html"><svg class="bw-icon" aria-hidden="true"><use href="../assets/icons.svg#chat"/></svg>对话</a>
    <a class="bw-tabbar__item" href="#"><svg class="bw-icon" aria-hidden="true"><use href="../assets/icons.svg#user"/></svg>我的</a>
  </nav>
</div>
</body>
</html>
