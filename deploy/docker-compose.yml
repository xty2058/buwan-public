# 不晚 hosted service: app (stdlib Python + SQLite) behind Caddy (automatic HTTPS).
# Usage on the server, from the repository root:
#   cp deploy/.env.example deploy/.env   # fill in domain and keys
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8840"
      APP_ALLOW_PUBLIC_BIND: "true"
      APP_ORIGIN: https://${BUWAN_DOMAIN:?set BUWAN_DOMAIN in deploy/.env}
      APP_COOKIE_SECURE: "true"
      APP_TRUST_PROXY: "true"
      APP_INVITE_REQUIRED: "true"
      APP_GUEST_TRIAL: "false"
      APP_INTERNAL_TOOLS: "false"
      APP_OPEN_CHARACTERS: linyu
      APP_DAILY_REPLY_LIMIT: ${DAILY_REPLY_LIMIT:-60}
      APP_DAILY_TOTAL_LIMIT: ${DAILY_TOTAL_LIMIT:-1500}
    volumes:
      - buwan-runtime:/app/runtime
    expose:
      - "8840"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      BUWAN_DOMAIN: ${BUWAN_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  buwan-runtime:
  caddy-data:
  caddy-config:
